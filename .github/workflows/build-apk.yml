name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/cron-metros.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cron-metros-apk
          path: dist/cron-metros.apk
          retention-days: 90

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Cron-metros — Última Build"
          body: |
            ## 📥 Download do APK

            Baixe o arquivo `cron-metros.apk` abaixo e instale no seu Android.

            > **Como instalar:** Ative "Fontes desconhecidas" nas configurações do Android, abra o arquivo e instale.

            ---
            Build gerada automaticamente a partir do commit `${{ github.sha }}`.
          prerelease: true
          make_latest: true
          files: dist/cron-metros.apk
